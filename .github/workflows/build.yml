name: Build OpenWrt with eBPF & Honk for NN6000-v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 准备编译环境
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang llvm gcc-multilib g++-multilib \
          dwarves libelf-dev flex bison autoconf automake libtool-bin pkg-config \
          libncurses5-dev libssl-dev zlib1g-dev libglib2.0-dev gengetopt \
          gettext git curl jq tar zstd
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: 拉取 OpenWrt 源码 (Qualcommax 6.12 主线)
      run: |
        git clone -b main --depth 1 https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 强制开启 Linux 6.12 内核完整 eBPF + BTF 编译选项
      run: |
        cd openwrt
        # 向高通 IPQ60xx 内核目标注入 BTF 与 eBPF 强制配置
        for cfg in target/linux/qualcommax/config-6.12 target/linux/qualcommax/config-default; do
          if [ -f "$cfg" ]; then
            echo "CONFIG_DEBUG_INFO=y" >> $cfg
            echo "CONFIG_DEBUG_INFO_BTF=y" >> $cfg
            echo "CONFIG_BPF=y" >> $cfg
            echo "CONFIG_BPF_SYSCALL=y" >> $cfg
            echo "CONFIG_BPF_JIT=y" >> $cfg
            echo "CONFIG_CGROUP_BPF=y" >> $cfg
            echo "CONFIG_NET_XGRESS=y" >> $cfg
            echo "CONFIG_NET_CLS_ACT=y" >> $cfg
          fi
        done

    - name: 预装最新版 aarch64 honk 核心
      run: |
        cd openwrt
        mkdir -p files/usr/bin files/etc/init.d files/etc/honk
        
        # 自动拉取 daeuniverse/honk 最新发布的 aarch64 二进制
        HONK_URL=$(curl -s https://api.github.com/repos/daeuniverse/honk/releases/latest | jq -r '.assets[] | select(.name | contains("aarch64")) | .browser_download_url' | head -n 1)
        if [ -n "$HONK_URL" ] && [ "$HONK_URL" != "null" ]; then
          echo "Downloading honk from: $HONK_URL"
          curl -Lo /tmp/honk.tar.gz "$HONK_URL"
          tar -xvf /tmp/honk.tar.gz -C files/usr/bin/ honk 2>/dev/null || tar -xvf /tmp/honk.tar.gz -C files/usr/bin/
          chmod +x files/usr/bin/honk
        fi

        # 创建 honk 开机自启守护服务
        cat << 'EOF' > files/etc/init.d/honk
        #!/bin/sh /etc/rc.common
        START=95
        STOP=10
        USE_PROCD=1
        start_service() {
            procd_open_instance
            procd_set_param command /usr/bin/honk run -c /etc/honk/config.dae
            procd_set_param respawn
            procd_set_param stdout 1
            procd_set_param stderr 1
            procd_close_instance
        }
        EOF
        chmod +x files/etc/init.d/honk

    - name: 注入设备与极简软件包配置 (.config)
      run: |
        cd openwrt
        cat << 'EOF' > .config
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq60xx=y
        CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y
        CONFIG_PACKAGE_kmod-bpf=y
        CONFIG_PACKAGE_kmod-sched-bpf=y
        CONFIG_PACKAGE_bpftool=y
        CONFIG_PACKAGE_samba4-server=y
        CONFIG_PACKAGE_luci-app-samba4=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_jq=y
        EOF
        make defconfig

    - name: 编译固件
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 收集固件产物
      run: |
        mkdir -p /tmp/firmware
        find openwrt/bin/targets/qualcommax/ipq60xx/ -type f -name "*nn6000*squashfs-sysupgrade.bin" -exec cp {} /tmp/firmware/ \;
        find openwrt/bin/targets/qualcommax/ipq60xx/ -type f -name "*nn6000*squashfs-factory.bin" -exec cp {} /tmp/firmware/ \;

    - name: 发布 Release 并供用户下载
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.run_id }}
        name: OpenWrt-NN6000-v2 (eBPF-BTF + Honk + Samba4)
        files: /tmp/firmware/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
